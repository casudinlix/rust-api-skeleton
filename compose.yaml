# Development only. Start one database profile, migrate, then start app processes.
name: rust-api-skeleton

x-app: &app
  image: rust-api-skeleton:local
  build:
    context: .
    args:
      DB_FEATURES: ${DB_FEATURES:-postgres,mysql}
  env_file: .env
  init: true
  pids_limit: 256
  environment:
    DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env}
    REDIS_URL: ${DOCKER_REDIS_URL:-}
    QUEUE_REDIS_URL: ${DOCKER_QUEUE_REDIS_URL:-}
    APP_ENV: local
    APP_HOST: 0.0.0.0
    APP_PORT: 3000
    OBSERVABILITY_HOST: 0.0.0.0
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - app_storage:/app/storage
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-bookworm
    profiles: [postgres]
    environment:
      POSTGRES_DB: rust_api
      POSTGRES_USER: rust_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rust_api -d rust_api"]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_DATABASE: rust_api
      MYSQL_USER: rust_api
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-development-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
    command: [--default-time-zone=+00:00]
    ports: ["127.0.0.1:3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Disposable development cache only; production Redis is configured separately.
  redis:
    image: redis:8.0
    profiles: [redis]
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  # Development queue storage. Unlike the disposable cache, retain queued data.
  # Configure authentication, network policy and recovery for real deployments.
  redis-queue:
    image: redis:8.0
    profiles: [redis-queue]
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports: ["127.0.0.1:6380:6379"]
    volumes: [redis_queue_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    profiles: [tools]
    command: [/usr/local/bin/migrate]
    restart: "no"
    healthcheck:
      disable: true

  api:
    <<: *app
    command: [/usr/local/bin/api]
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    expose: ["9100"]
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck, "9100"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  worker:
    <<: *app
    command: [/usr/local/bin/worker]
    expose: ["9101"]
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck, "9101"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  scheduler:
    <<: *app
    command: [/usr/local/bin/scheduler]
    expose: ["9102"]
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck, "9102"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Optional: set QUEUE_DRIVER=redis and QUEUE_RELAY_ENABLED=false for workers
  # when managing this relay as an independent process.
  relay:
    <<: *app
    profiles: [relay]
    command: [/usr/local/bin/relay]
    expose: ["9103"]
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck, "9103"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
  mysql_data:
  redis_queue_data:
  app_storage:
