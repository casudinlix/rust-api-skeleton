name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit and HTTP contracts
        run: cargo test --locked --all-targets
      - name: Rustdoc examples
        run: cargo test --locked --doc
      - name: Compile PostgreSQL only
        run: cargo check --locked --all-targets --no-default-features --features postgres
      - name: Compile MySQL only
        run: cargo check --locked --all-targets --no-default-features --features mysql

  databases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rust_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d rust_api_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rust_api_test
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_ROOT_HOST: "%"
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.0
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: PostgreSQL migrations, API and queue
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/rust_api_test
        run: make test-postgres
      - name: MySQL migrations, API and queue
        env:
          TEST_DATABASE_URL: mysql://root:test-only@127.0.0.1:3306/rust_api_test
        run: make test-mysql
      - name: Redis cache integration
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: make test-redis
      - name: Redis queue transport
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: make test-redis-transport
      - name: Redis queue with PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/rust_api_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: make test-queue-postgres
      - name: Redis queue with MySQL
        env:
          TEST_DATABASE_URL: mysql://root:test-only@127.0.0.1:3306/rust_api_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: make test-queue-mysql
